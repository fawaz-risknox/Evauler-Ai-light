<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Soft blue flowing valuation curves">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfeff" />
      <stop offset="0.52" stop-color="#f8faff" />
      <stop offset="1" stop-color="#eef4fe" />
    </linearGradient>
    <linearGradient id="rightField" x1="0" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#eef3fd" />
      <stop offset="0.42" stop-color="#dfe8fc" />
      <stop offset="1" stop-color="#cddaf8" />
    </linearGradient>
    <linearGradient id="bottomLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c7d6f7" />
      <stop offset="0.55" stop-color="#d3dffa" />
      <stop offset="1" stop-color="#e5edfd" />
    </linearGradient>
    <linearGradient id="bottomRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5ecfd" />
      <stop offset="0.5" stop-color="#d1ddfa" />
      <stop offset="1" stop-color="#c5d4f6" />
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)" />

  <!-- Large periwinkle field with a soft sweeping edge -->
  <path d="M 1430 -40 C 1350 120 1260 280 1170 450 C 1070 650 1010 790 1015 940 L 1640 940 L 1640 -40 Z" fill="url(#rightField)" filter="url(#soft)" opacity="0.92" />
  <path d="M 1370 -40 C 1290 150 1200 320 1110 500 C 1010 700 960 820 980 940 L 1640 940 L 1640 -40 Z" fill="#d7e2fb" filter="url(#softer)" opacity="0.45" />

  <!-- Bottom left band -->
  <path d="M -40 940 L -40 700 C 170 730 420 815 760 940 Z" fill="url(#bottomLeft)" filter="url(#soft)" opacity="0.95" />

  <!-- Bottom right band -->
  <path d="M 560 950 C 820 820 1100 785 1420 820 C 1520 831 1600 852 1660 878 L 1660 950 Z" fill="url(#bottomRight)" filter="url(#soft)" opacity="0.92" />

  <!-- White channel that separates the curves -->
  <path d="M 430 980 C 740 855 1080 810 1430 840 C 1520 848 1600 866 1660 892" fill="none" stroke="#fbfcff" stroke-width="32" opacity="0.78" filter="url(#soft)" />

  <!-- Top left haze -->
  <ellipse cx="90" cy="140" rx="460" ry="320" fill="#e9f0fd" opacity="0.7" filter="url(#softer)" />
</svg>
